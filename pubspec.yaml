name: carta_facile
description: "Carta Facile – guida ai documenti e all'italiano per chi vive in Italia."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_tts: ^4.2.0
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
